[alembic]
script_location = %(here)s/alembic
# DATABASE_URL is injected at runtime from settings via alembic/env.py
# Override here only for Alembic CLI direct runs without .env loaded:
sqlalchemy.url = postgresql://eduuser:srr28082006@db:5432/eduai_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
