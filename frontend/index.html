<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23468068'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidyaranya — AI Academic Assessment Platform</title>
    <meta name="description" content="Agentic, AI-powered academic assessment, intelligent grading rubrics, topic mastery tracking, and grounded AI tutor for modern classrooms." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      try {
        const savedTheme = localStorage.getItem('vidyaranya_theme');
        const useDark = savedTheme === 'dark' || (savedTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', useDark);
        document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
      } catch {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen selection:bg-primary selection:text-primary-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
